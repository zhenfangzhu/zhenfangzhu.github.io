<body data-title-zh="Founder DNA 创始人禀赋测试 | 朱振方" data-title-en="Founder DNA Assessment | Zhenfang Zhu">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <a class="site-home-link" href="/" aria-label="返回朱振方个人主页">← 个人主页</a>
  <div id="app" class="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="file-import" class="sr-only" type="file" accept="application/json,.json">
  <script>
  (()=>{'use strict';
    // Models
    const STORAGE_KEY='founder-dna-v1';
    const DIMENSIONS=[
      {id:'explore',name:'0→1 探索',short:'探索',definition:'从模糊问题中发现机会，并快速做出第一个版本。',scenes:'新项目、新课程、产品探索'},
      {id:'insight',name:'用户洞察',short:'洞察',definition:'理解用户真正需要什么，而不只是听表面需求。',scenes:'产品、课程设计、用户研究'},
      {id:'growth',name:'影响与增长',short:'增长',definition:'让别人理解价值、产生兴趣并采取行动。',scenes:'抖音增长、销售、品牌'},
      {id:'build',name:'建造与实现',short:'建造',definition:'把抽象想法变成真实可用的产品。',scenes:'研发、软件、课程开发'},
      {id:'operate',name:'运营与秩序',short:'运营',definition:'让复杂、混乱的事情稳定运行。',scenes:'排课、交付、项目管理'},
      {id:'system',name:'系统化与复制',short:'系统',definition:'把个人经验变成团队可复制的方法。',scenes:'标准化、培训、规模化'},
      {id:'lead',name:'判断与领导',short:'判断',definition:'抓住关键问题、作出选择，并承担结果。',scenes:'CEO、负责人、关键决策'},
      {id:'resilience',name:'韧性与长期主义',short:'韧性',definition:'在短期没有反馈时仍然持续推进。',scenes:'创业、长期产品、困难项目'}
    ];
    const SCENES=['从零开始做新项目','面对家长和用户','对外表达和销售','独立建造产品','复杂现场执行','建立流程和标准','做关键决策','长期解决困难问题'];
    const STRESS=['立即行动并试错','先分析信息','主动寻找用户反馈','组织其他人协作','亲自把问题解决','等待方向更清晰'];
    const ROLE_WEIGHTS={
      'CEO / Direction Setter':{lead:.30,explore:.25,growth:.20,resilience:.15,insight:.10},
      'Product Lead':{insight:.30,explore:.25,build:.25,lead:.20},
      'Growth Lead':{growth:.40,insight:.30,explore:.15,resilience:.15},
      'Builder / Technical Lead':{build:.45,system:.20,explore:.20,resilience:.15},
      'Operations Lead':{operate:.40,system:.30,resilience:.20,lead:.10},
      'Curriculum Product Lead':{insight:.25,system:.25,build:.20,explore:.15,operate:.15},
      'Sales / Customer Lead':{growth:.35,insight:.35,resilience:.15,lead:.15},
      'Systems / Scale Lead':{system:.40,operate:.25,build:.20,lead:.15}
    };
    const PROJECT_DEFAULT={type:'线下 AI 编程教育',value:'孩子能够通过 AI 编程做出真实产品，提升创造力、表达能力和工程能力，同时让家长感受到新鲜且真实的学习成果。',product:'线下 AI 编程课程',acquisition:'抖音',stage:'约 200 名付费用户；约 1600 名抖音私域用户；约 200 名微信社群用户',direction:'课程标准化；增加付费人数；提高收入；开发面向家长和学生的软件产品',software:'正在开发，已有原型'};
    const DEFAULT_NAMES=['朱振方','创始人 B','创始人 C'];

    // Question Bank — every dimension has one reverse-scored behavioral item.
    const QUESTION_TEXT={
      explore:['当项目方向还不清楚时，他是否会主动提出一个可以立即测试的方案？','当没有成熟参考时，他是否仍能先做出一个可用版本？','他是否经常发现别人还没有注意到的新机会？','面对不确定任务时，他是否经常等待别人先给出明确答案？'],
      insight:['当家长说“再考虑一下”时，他是否能判断对方真正顾虑的是什么？','他是否能从孩子的课堂反应中发现课程需要改进的地方？','他是否能把零散反馈总结成清晰的用户需求？','他是否经常只按自己的想法做产品，很少验证用户是否真的需要？'],
      growth:['他是否能用清晰表达让家长快速理解课程的独特价值？','他是否会主动测试内容、话术或渠道来提升转化？','面对潜在合作或销售机会时，他是否能推动对方采取下一步行动？','当外界反应冷淡时，他是否通常停止表达，而不再调整方式？'],
      build:['面对一个抽象想法时，他是否能快速拆成可交付的产品或课程？','遇到技术或制作障碍时，他是否能找到替代方案继续推进？','他是否经常亲手交付可以被真实用户使用的版本？','他是否容易停留在讨论和设想，而迟迟没有可用成果？'],
      operate:['多人、多任务同时进行时，他是否能建立清晰排期和责任边界？','现场出现突发情况时，他是否能稳定处理并保证交付？','他是否会主动检查细节并提前发现可能出错的环节？','重复性运营工作中，他是否经常遗漏关键步骤或后续跟进？'],
      system:['他是否会把成功经验整理成 SOP、模板或检查清单？','他是否能把自己会做的事情教会其他人稳定完成？','面对重复问题时，他是否倾向于建立长期机制而不只解决一次？','他是否经常依赖个人记忆和临场发挥，难以让方法被复制？'],
      lead:['信息不完整时，他是否仍能抓住关键问题并作出选择？','出现分歧时，他是否能推动讨论形成明确决定与负责人？','关键结果不理想时，他是否愿意承担责任并调整方向？','面对高风险决定时，他是否经常回避表态、等待别人负责？'],
      resilience:['短期没有正向反馈时，他是否仍能按节奏推进重要工作？','遇到连续挫折后，他是否能复盘并再次尝试？','面对枯燥但重要的长期任务时，他是否能保持稳定投入？','困难持续出现时，他是否容易频繁换方向或放弃原计划？']
    };
    const QUESTIONS=DIMENSIONS.flatMap(d=>QUESTION_TEXT[d.id].map((text,i)=>({id:`${d.id}-${i+1}`,dimension:d.id,text,reverse:i===3})));

    function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
    function clamp(v,min=0,max=100){return Math.min(max,Math.max(min,v))}
    function escapeHtml(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function blankEvent(){return{id:uid(),context:'',action:'',result:'',dimensions:[]}}
    function makeFounders(names=DEFAULT_NAMES){return names.map((name,i)=>({id:['A','B','C'][i],name}))}
    function makeEvaluations(founders){const out=[];founders.forEach(evaluator=>{const targets=[evaluator,...founders.filter(f=>f.id!==evaluator.id)];targets.forEach(target=>out.push({id:`${evaluator.id}-${target.id}`,evaluatorId:evaluator.id,targetId:target.id,answers:{},top3:['','',''],nonNatural:'',scenes:[],stress:'',events:[blankEvent(),blankEvent()],status:'not_started',submittedAt:null,updatedAt:null}))});return out}
    function createFormal(){const founders=makeFounders();return{project:{...PROJECT_DEFAULT},founders,evaluations:makeEvaluations(founders),calibration:{founders:{},consensus:'',date:''},settings:{theme:'system'}}}
    function validEvent(e){return e&&e.context.trim()&&e.action.trim()&&e.result.trim()}
    function seeded(n){const x=Math.sin(n*999)*10000;return x-Math.floor(x)}
    function makeDemo(){const data=createFormal();const targetBases={A:{explore:4.3,insight:4.6,growth:4.7,build:3.2,operate:3.1,system:3.4,lead:4.3,resilience:4.1},B:{explore:3.5,insight:3.6,growth:3.1,build:3.8,operate:4.7,system:4.6,lead:4.0,resilience:4.5},C:{explore:4.2,insight:3.8,growth:3.0,build:4.8,operate:3.4,system:4.1,lead:3.7,resilience:4.3}};
      data.evaluations.forEach((e,ei)=>{QUESTIONS.forEach((q,qi)=>{let v=targetBases[e.targetId][q.dimension]+(seeded(ei*40+qi)-.5)*.8+(e.evaluatorId===e.targetId ? .12 : 0); if(q.reverse)v=6-v;e.answers[q.id]=clamp(Math.round(v),1,5)}); const sorted=DIMENSIONS.slice().sort((a,b)=>targetBases[e.targetId][b.id]-targetBases[e.targetId][a.id]);e.top3=sorted.slice(0,3).map(d=>d.id);e.nonNatural=sorted.at(-1).id;e.scenes=sorted.slice(0,3).map(d=>SCENES[DIMENSIONS.findIndex(x=>x.id===d.id)]);e.stress=e.targetId==='A'?STRESS[2]:e.targetId==='B'?STRESS[3]:STRESS[4];const name=data.founders.find(f=>f.id===e.targetId).name;e.events=[{id:uid(),context:'一次课程转化或产品推进遇到瓶颈。',action:`${name} 主动拆解问题，提出方案并推动团队完成一次真实验证。`,result:'团队获得了可观察的用户反馈，下一步方向更清晰。',dimensions:e.top3.slice(0,2)},{id:uid(),context:'团队需要在有限时间内完成一次关键交付。',action:`${name} 承担主要责任，协调资源并交付了可用成果。`,result:'任务按期完成，并沉淀了后续可以复用的经验。',dimensions:[e.top3[0],e.top3[2]]},{id:uid(),context:'项目目标变化，需要快速调整计划。',action:`${name} 根据新信息重排优先级并持续推进。`,result:'避免了无效投入，核心目标取得进展。',dimensions:[e.top3[1]]}];e.status='completed';e.submittedAt=new Date().toISOString();e.updatedAt=e.submittedAt});return data}

    // Storage
    const Storage={load(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):null}catch{return null}},save(root){localStorage.setItem(STORAGE_KEY,JSON.stringify(root))},clear(){localStorage.removeItem(STORAGE_KEY)}};
    let root=Storage.load()||{version:1,activeMode:null,formal:createFormal(),demo:makeDemo()};
    if(!root.formal)root.formal=createFormal();if(!root.demo)root.demo=makeDemo();
    let ui={page:'dashboard',evaluationId:null,evalStep:0,profileId:'A',mobileNav:false};
    const data=()=>root.activeMode==='demo'?root.demo:root.formal;
    function persist(message='已自动保存'){Storage.save(root);updateSaveState(message)}

    // Evaluation Engine
    function evaluatorMean(evaluatorId){const vals=[];data().evaluations.filter(e=>e.evaluatorId===evaluatorId).forEach(e=>Object.values(e.answers).forEach(v=>{if(Number(v))vals.push(Number(v))}));return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:3.3}
    function adjustedAnswer(raw,evaluatorId){return clamp(Number(raw)-(evaluatorMean(evaluatorId)-3.3)*.4,1,5)}
    function calculateEvidenceConfidence(e){const n=e.events.filter(validEvent).length;return n===0?.70:n===1?.85:n===2?1:1.05}
    function calculateDimensionScore(e,dimId){const qs=QUESTIONS.filter(q=>q.dimension===dimId);if(qs.some(q=>!e.answers[q.id]))return null;const avg=qs.reduce((sum,q)=>{let v=adjustedAnswer(e.answers[q.id],e.evaluatorId);if(q.reverse)v=6-v;return sum+v},0)/qs.length;const base=avg*20;let mod=e.top3[0]===dimId?8:e.top3[1]===dimId?5:e.top3[2]===dimId?3:0;if(e.nonNatural===dimId)mod-=5;return clamp(base*calculateEvidenceConfidence(e)+mod)}
    function calculateFounderProfile(founderId){const evs=data().evaluations.filter(e=>e.targetId===founderId&&e.status==='completed');const self=evs.find(e=>e.evaluatorId===founderId);const peers=evs.filter(e=>e.evaluatorId!==founderId);const scores={};DIMENSIONS.forEach(d=>{const s=self?calculateDimensionScore(self,d.id):null;const pv=peers.map(e=>calculateDimensionScore(e,d.id)).filter(v=>v!==null);const p=pv.length?pv.reduce((a,b)=>a+b,0)/pv.length:null;let final=s!==null&&p!==null?s*.25+p*.75:s!==null?s:p!==null?p:0;scores[d.id]={self:s,peer:p,final:clamp(final),gap:s!==null&&p!==null?s-p:null}});return{id:founderId,scores,completed:evs.length}}
    function calculateRoleFit(profile){return Object.entries(ROLE_WEIGHTS).map(([name,w])=>({name,score:Object.entries(w).reduce((s,[d,x])=>s+profile.scores[d].final*x,0)})).sort((a,b)=>b.score-a.score)}
    function calculateSelfTeamGap(score){if(score.gap===null)return'等待完整评价';const g=score.gap;if(g>15)return'自我评价明显高于伙伴观察';if(g>8)return'自我评价略高于伙伴观察';if(g<-15)return'明显低估自己的优势';if(g<-8)return'可能低估自己的优势';return'认知基本一致'}
    function level(score){return score>=85?'Signature Strength｜标志性禀赋':score>=70?'Natural Strength｜自然优势':score>=55?'Capable｜能够胜任':score>=40?'Support Needed｜需要搭档补位':'Non-Natural Zone｜非自然区域'}
    function roleLevel(score){return score>=85?'Strong Fit':score>=70?'Good Fit':score>=55?'Experimental Fit':'Support Role'}
    function calculateTeamMap(){const profiles=data().founders.map(f=>calculateFounderProfile(f.id));const dims=DIMENSIONS.map(d=>{const values=profiles.map(p=>p.scores[d.id].final);return{...d,values,avg:values.reduce((a,b)=>a+b,0)/values.length,max:Math.max(...values),min:Math.min(...values)}});return{profiles,dims,coverage:dims.filter(d=>d.max>=75).sort((a,b)=>b.max-a.max),gaps:dims.filter(d=>d.max<70).sort((a,b)=>a.max-b.max),overlap:dims.filter(d=>d.min>=68).sort((a,b)=>b.avg-a.avg)}}
    function founderName(id){return data().founders.find(f=>f.id===id)?.name||id}
    function topDimensions(profile,n=3){return DIMENSIONS.map(d=>({...d,...profile.scores[d.id]})).sort((a,b)=>b.final-a.final).slice(0,n)}
    function evidenceFor(founderId,dimId){return data().evaluations.filter(e=>e.targetId===founderId&&e.status==='completed').flatMap(e=>e.events.filter(validEvent).filter(x=>x.dimensions.includes(dimId))).slice(0,3)}
    function generateFounderSummary(profile){const t=topDimensions(profile,2);if(!profile.completed)return`${founderName(profile.id)} 的画像将在评价完成后生成。`;const archetype=t[0].id==='growth'?'市场与增长型':t[0].id==='build'?'产品建造型':t[0].id==='operate'?'稳定运营型':t[0].id==='system'?'系统规模型':t[0].id==='insight'?'用户驱动型':t[0].id==='lead'?'方向领导型':t[0].id==='resilience'?'长期攻坚型':'探索创新型';return`${founderName(profile.id)}是一名以${t[0].name}和${t[1].name}为核心优势的${archetype}创始人，更容易在${t[0].scenes.split('、').slice(0,2).join('与')}中自然创造价值。`}
    function founderManual(profile){const top=topDimensions(profile,2),low=topDimensions(profile,8).slice(-2),roles=calculateRoleFit(profile);return[
      ['我最容易创造价值的场景',`${top[0].scenes}，尤其是需要${top[0].definition.replace('。','')}的任务。`],
      ['与我合作的最佳方式',`先明确结果和决策边界，让我主导${top[0].name}相关环节，并用真实用户或交付结果反馈。`],
      ['我适合先承担什么',`${roles[0].name} 方向的端到端责任；通过下一阶段真实任务继续验证。`],
      ['我需要怎样的搭档',`由在${low[0].name}或${low[1].name}上更自然的人补位，建立清晰流程与复盘节点。`],
      ['什么工作不适合长期由我承担',`${low[0].name}密集、反馈周期长且缺少结构的工作不宜长期独自承担；这不表示能力差，而是可能需要更多精力或搭档支持。`]
    ]}
    function nextExperiment(profile){const top=topDimensions(profile,1)[0],mid=topDimensions(profile,8).filter(x=>x.final>=50&&x.final<75)[0]||topDimensions(profile,8)[3];const task={growth:'完成一次抖音增长实验，从内容假设、线索获取到家长转化全流程负责',insight:'访谈 10 位家长并观察 3 次课堂，把反馈转成一项课程改进',explore:'从当前业务瓶颈提出 3 个假设，并在 30 天内交付一个可验证 MVP',build:'把一个软件原型推进成可供至少 10 位家长或学生试用的版本',operate:'负责一个月课程交付，建立排期、风险清单与每周复盘',system:'把一段核心课程或销售流程沉淀为 SOP，并让另一位成员独立复现',lead:'牵头一次关键优先级决策，明确目标、负责人、期限和复盘指标',resilience:'认领一个长期瓶颈，每周记录投入、反馈、调整与结果'}[top.id];return`未来 30 天，由${founderName(profile.id)}${task}；同时观察其${mid.name}表现，记录过程证据、核心指标和最终结果。`}

    // UI primitives
    const icons={dashboard:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>',tasks:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',team:'<circle cx="9" cy="7" r="4"/><path d="M2 21a7 7 0 0114 0M16 3.5a4 4 0 010 7.5M18 14a7 7 0 014 7"/>',cal:'<path d="M4 4h16v16H4zM8 9h8M8 13h5M8 17h3"/>',report:'<path d="M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6v.2h-4V21a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 00.3-1.9A1.7 1.7 0 003 14H2.8v-4H3a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 001.9.3A1.7 1.7 0 0010 3V2.8h4V3a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 00-.3 1.9 1.7 1.7 0 001.6 1h.2v4H21a1.7 1.7 0 00-1.6 1z"/>',moon:'<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',data:'<path d="M12 3v12M8 11l4 4 4-4M5 21h14"/>'};
    function icon(name){return`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`}
    const NAV=[['dashboard','首页','dashboard'],['tasks','评估任务','tasks'],['profile','个人画像','profile'],['team','团队地图','team'],['calibration','校准会议','cal'],['report','最终报告','report'],['settings','设置与数据','settings']];
    function shell(content){const title=NAV.find(x=>x[0]===ui.page)?.[1]||'Founder DNA';return`<aside class="sidebar ${ui.mobileNav?'open':''}" aria-label="主导航"><div class="brand"><strong>Founder DNA</strong><span>Evidence over personality</span></div><nav class="nav">${NAV.map(([id,label,ic])=>`<button data-nav="${id}" class="${ui.page===id?'active':''}" ${ui.page===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}</nav><div class="sidebar-foot"><div class="mode-pill">${root.activeMode==='demo'?'Demo 数据 · 与正式数据隔离':'正式评估 · 本机保存'}</div><div class="sidebar-actions"><button class="icon-btn" data-action="theme" aria-label="切换明暗模式" title="切换明暗模式">${icon('moon')}</button><button class="icon-btn" data-nav="settings" aria-label="数据导入导出" title="数据导入导出">${icon('data')}</button></div></div></aside><main class="main"><header class="topbar"><button class="icon-btn mobile-menu" data-action="menu" aria-label="打开导航">${icon('menu')}</button><h1>${title}</h1><div id="save-state" class="save-state">数据保存在此浏览器</div></header><div id="main-content" class="content" tabindex="-1">${content}</div></main>`}
    function statusOf(e){if(e.status==='completed')return['已完成','done'];if(Object.keys(e.answers).length||e.events.some(validEvent))return['进行中','progressing'];return['未开始','']}
    function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3200)}
    function updateSaveState(msg){const el=document.getElementById('save-state');if(el)el.textContent=msg}
    function render(){applyTheme();let content='';if(ui.page==='dashboard')content=dashboardPage();else if(ui.page==='tasks')content=ui.evaluationId?evaluationPage():tasksPage();else if(ui.page==='profile')content=profilePage();else if(ui.page==='team')content=teamPage();else if(ui.page==='calibration')content=calibrationPage();else if(ui.page==='report')content=reportPage();else content=settingsPage();document.getElementById('app').innerHTML=shell(content);bind();window.scrollTo({top:0,behavior:'auto'})}

    // Pages
    function dashboardPage(){const done=data().evaluations.filter(e=>e.status==='completed').length;return`<section class="hero"><div class="eyebrow">Founder intelligence, grounded in evidence</div><h2>Founder DNA</h2><p class="lead">Know how you naturally create value.</p><p class="cn">不是给人排名，而是通过真实项目，看清每个人天然擅长什么，以及三个人怎样组合更强。</p><blockquote class="quote">Great founding teams are not built from identical people. They are built from complementary strengths.</blockquote></section><section class="grid stats" aria-label="项目概览"><div class="stat"><strong>3</strong><span>Founders</span></div><div class="stat"><strong>9</strong><span>Evaluations</span></div><div class="stat"><strong>8</strong><span>Talent Dimensions</span></div><div class="stat"><strong>1</strong><span>Team Map</span></div></section><div class="actions"><button class="btn primary" data-nav="tasks">${done?'继续评价':'开始评价'}</button><button class="btn" data-nav="team">查看团队地图</button><button class="btn" data-nav="calibration">打开校准会议</button></div><section class="section"><div class="section-head"><div><h2>Founding team</h2><p>${escapeHtml(data().project.type)} · 当前方向：${escapeHtml(data().project.direction)}</p></div></div><div class="grid founders">${data().founders.map(f=>`<article class="card founder-card"><div class="avatar">${f.id}</div><div><strong>${escapeHtml(f.name)}</strong><span>${topDimensions(calculateFounderProfile(f.id),1)[0]?.final?`${topDimensions(calculateFounderProfile(f.id),1)[0].name} · ${Math.round(topDimensions(calculateFounderProfile(f.id),1)[0].final)}`:'画像待生成'}</span></div></article>`).join('')}</div><div class="progress-wrap"><div class="progress-meta"><span>已完成评价：${done} / 9</span><span>${Math.round(done/9*100)}%</span></div><div class="progress"><i style="width:${done/9*100}%"></i></div></div></section><div class="principle"><div><strong>Discuss evidence, not personality.</strong><br><span>讨论事件，不评价人格。</span></div><span>每一个结论，都回到真实行为与结果。</span></div>`}
    function tasksPage(){return`<div class="eyebrow">9 structured evaluations</div><h1 class="page-title">评估任务</h1><p class="page-sub">按评价者依次填写。每个人填写时不会显示其他人的结果，减少相互影响。草稿会随时自动保存。</p><section class="section task-list">${data().evaluations.map((e,i)=>{const [s,c]=statusOf(e);const self=e.evaluatorId===e.targetId;return`<button class="task" data-eval="${e.id}"><span class="task-num">${String(i+1).padStart(2,'0')}</span><span><strong>${founderName(e.evaluatorId)}${self?'自评':`评价${founderName(e.targetId)}`}</strong><small>${self?'从自己的真实工作体验出发':'只基于共同经历过的真实事件'}</small></span><span class="badge ${c}">${s}</span></button>`}).join('')}</section>`}
    function evaluationPage(){const e=data().evaluations.find(x=>x.id===ui.evaluationId);if(!e){ui.evaluationId=null;return tasksPage()}const name=founderName(e.targetId),isSelf=e.evaluatorId===e.targetId;const totalSteps=10;let body='';if(ui.evalStep<8){const d=DIMENSIONS[ui.evalStep],qs=QUESTIONS.filter(q=>q.dimension===d.id);body=`<div class="dimension-intro"><span class="kicker">维度 ${ui.evalStep+1} / 8</span><h2>${d.name}</h2><p>${d.definition}</p></div>${qs.map((q,i)=>`<fieldset class="question"><legend class="sr-only">问题 ${i+1}</legend><div class="question-head"><span class="question-index">${String(i+1).padStart(2,'0')}</span><p>${q.text}${q.reverse?'<span class="reverse">反向题</span>':''}</p></div><div class="scale">${[1,2,3,4,5].map(v=>`<label title="${['几乎没有观察到','偶尔出现','能够稳定做到','多次主动做到','已经形成明显优势'][v-1]}"><input type="radio" name="${q.id}" value="${v}" data-answer="${q.id}" ${Number(e.answers[q.id])===v?'checked':''}><span>${v}</span></label>`).join('')}</div><div class="scale-help"><span>几乎没有观察到</span><span>已经形成明显优势</span></div></fieldset>`).join('')}`}
      else if(ui.evalStep===8){body=`<div class="dimension-intro"><span class="kicker">强制选择</span><h2>做出取舍</h2><p>排序会用于温和修正量表分数，避免所有优势看起来同样重要。</p></div><div class="grid choice-grid">${[0,1,2].map((x)=>`<div class="field"><label for="top-${x}">${['第一禀赋','第二禀赋','第三禀赋'][x]}</label><select id="top-${x}" data-top="${x}"><option value="">请选择</option>${DIMENSIONS.map(d=>`<option value="${d.id}" ${e.top3[x]===d.id?'selected':''}>${d.name}</option>`).join('')}</select></div>`).join('')}<div class="field"><label for="non-natural">一项非自然优势</label><select id="non-natural" data-field="nonNatural"><option value="">请选择</option>${DIMENSIONS.map(d=>`<option value="${d.id}" ${e.nonNatural===d.id?'selected':''}>${d.name}</option>`).join('')}</select><small>不代表能力差，而是通常需要更多精力或外部结构支持。</small></div></div><div class="section"><div class="field"><span class="label">高能场景（最多 3 项）</span><div class="chips">${SCENES.map(s=>`<label class="chip"><input type="checkbox" data-scene value="${s}" ${e.scenes.includes(s)?'checked':''}><span>${s}</span></label>`).join('')}</div></div></div><div class="section field"><label for="stress">压力下的默认反应</label><select id="stress" data-field="stress"><option value="">请选择</option>${STRESS.map(s=>`<option ${e.stress===s?'selected':''}>${s}</option>`).join('')}</select></div>`}
      else{body=`<div class="dimension-intro"><span class="kicker">真实事件证据</span><h2>发生过什么？</h2><p>至少填写 2 个同时包含背景、行动和结果的事件。讨论事件，不评价人格。</p></div><div id="events">${e.events.map((ev,i)=>eventEditor(ev,i,e.events.length)).join('')}</div><button class="btn small" data-action="add-event">＋ 添加事件</button><div id="eval-errors"></div>`}
      const answered=QUESTIONS.filter(q=>e.answers[q.id]).length;return`<div class="eval-head"><div><div class="eyebrow">${isSelf?'Self evaluation':'Peer evaluation'}</div><h1 class="page-title">${isSelf?`${name}自评`:`${founderName(e.evaluatorId)}评价${name}`}</h1><p class="page-sub">${answered}/32 道行为题已回答 · 评价者宽松度会被温和校正</p></div><button class="btn no-print" data-action="close-eval">返回任务</button></div><div class="card form-card"><div class="eval-tabs" aria-label="评价步骤">${Array.from({length:10},(_,i)=>`<button data-step="${i}" class="${ui.evalStep===i?'active':''} ${i<8&&QUESTIONS.filter(q=>q.dimension===DIMENSIONS[i].id).every(q=>e.answers[q.id])?'answered':''}" aria-label="${i<8?DIMENSIONS[i].name:i===8?'强制选择':'事件证据'}" aria-pressed="${ui.evalStep===i}">${i<8?i+1:i===8?'选':'证'}</button>`).join('')}</div>${body}<div class="sticky-actions"><button class="btn" data-action="prev-step" ${ui.evalStep===0?'disabled':''}>上一步</button><span class="save-state">草稿自动保存</span>${ui.evalStep<totalSteps-1?'<button class="btn primary" data-action="next-step">下一步</button>':'<button class="btn accent" data-action="submit-eval">提交评价</button>'}</div></div>`}
    function eventEditor(ev,i,total){return`<div class="event-card" data-event-id="${ev.id}"><div class="event-top"><strong>事件 ${i+1}</strong><button class="btn small danger" data-remove-event="${ev.id}" ${total<=2?'disabled title="至少保留两个事件"':''}>删除</button></div><div class="grid form-grid"><div class="field"><label>事件背景</label><textarea data-event-field="context" placeholder="何时、什么任务、遇到什么情况">${escapeHtml(ev.context)}</textarea></div><div class="field"><label>这个人做了什么</label><textarea data-event-field="action" placeholder="具体行动，而非性格判断">${escapeHtml(ev.action)}</textarea></div><div class="field"><label>产生了什么结果</label><textarea data-event-field="result" placeholder="用户、业务或团队发生了什么变化">${escapeHtml(ev.result)}</textarea></div><div class="field"><span class="label">体现了哪些禀赋</span><div class="chips">${DIMENSIONS.map(d=>`<label class="chip"><input type="checkbox" data-event-dim value="${d.id}" ${ev.dimensions.includes(d.id)?'checked':''}><span>${d.name}</span></label>`).join('')}</div></div></div></div>`}
    function profilePage(){const p=calculateFounderProfile(ui.profileId);const top=topDimensions(p,3),roles=calculateRoleFit(p),manual=founderManual(p);return`<div class="eyebrow">Founder profile</div><h1 class="page-title">个人禀赋画像</h1><div class="profile-tabs">${data().founders.map(f=>`<button class="btn ${ui.profileId===f.id?'active':''}" data-profile="${f.id}">${escapeHtml(f.name)}</button>`).join('')}</div>${p.completed?`<section class="card"><div class="eyebrow">Founder Snapshot</div><p class="snapshot">${generateFounderSummary(p)}</p></section><section class="section"><div class="section-head"><div><h2>Signature Strengths</h2><p>前三项禀赋及主要证据</p></div></div><div class="grid strength-grid">${top.map((d,i)=>`<article class="card strength"><span class="rank">0${i+1} · ${level(d.final).split('｜')[0]}</span><div class="score">${Math.round(d.final)}</div><h3>${d.name}</h3><p>${d.definition}</p><p style="margin-top:12px">${evidenceFor(p.id,d.id)[0]?`证据：${escapeHtml(evidenceFor(p.id,d.id)[0].result)}`:'证据仍需在下一次真实任务中补充。'}</p></article>`).join('')}</div></section>${selfVsTeam(p)}<section class="section"><div class="section-head"><div><h2>Energy Map</h2><p>分数表示自然程度，不是能力上限。</p></div></div><div class="grid insight-grid">${[['高能区',DIMENSIONS.filter(d=>p.scores[d.id].final>=70)],['可胜任区',DIMENSIONS.filter(d=>p.scores[d.id].final>=55&&p.scores[d.id].final<70)],['高消耗区',DIMENSIONS.filter(d=>p.scores[d.id].final<55)]].map(([title,arr])=>`<div class="card"><h3>${title}</h3><p>${arr.length?arr.map(d=>d.name).join(' · '):'暂无维度'}</p></div>`).join('')}</div></section><section class="section"><div class="section-head"><div><h2>Founder Manual</h2><p>把画像转成更具体的协作方式。</p></div></div><div class="grid manual-grid">${manual.map(([a,b])=>`<div class="manual-item"><strong>${a}</strong><p>${b}</p></div>`).join('')}</div></section><section class="section card"><div class="section-head"><div><h2>Role Fit</h2><p>建议用真实责任继续验证，不构成角色限制。</p></div></div><div class="role-list">${roles.map(r=>`<div class="role"><span><strong>${r.name}</strong><br><small>${roleLevel(r.score)}</small></span><div class="mini-track"><i style="width:${r.score}%"></i></div><strong>${Math.round(r.score)}</strong></div>`).join('')}</div></section><section class="section card"><div class="eyebrow">Next experiment · 30 days</div><h2>下一阶段验证任务</h2><p>${nextExperiment(p)}</p></section>`:`<div class="empty">${escapeHtml(founderName(p.id))} 还没有已完成的评价。<br><button class="btn primary" style="margin-top:16px" data-nav="tasks">开始评价</button></div>`}`}
    function selfVsTeam(p){return`<section class="section card"><div class="section-head"><div><h2>Self vs Team</h2><p>自评 25% · 伙伴观察 75%</p></div></div><div class="legend"><span><i style="background:#9ba2ad"></i>自评</span><span><i style="background:#7297e8"></i>伙伴平均</span><span><i style="background:var(--accent)"></i>最终分</span></div><div class="bar-table">${DIMENSIONS.map(d=>{const s=p.scores[d.id];return`<div class="bar-row"><div class="bar-label"><strong>${d.name}</strong><small>${calculateSelfTeamGap(s)}</small></div><div class="bars"><div class="bar-track self"><i style="width:${s.self||0}%"></i></div><div class="bar-track peer"><i style="width:${s.peer||0}%"></i></div><div class="bar-track final"><i style="width:${s.final}%"></i></div></div><span class="bar-score">${Math.round(s.final)}</span></div>`}).join('')}</div></section>`}
    function teamPage(){const m=calculateTeamMap();if(m.profiles.some(p=>!p.completed))return`<div class="eyebrow">Team complementarity</div><h1 class="page-title">团队互补地图</h1><div class="empty section">完整团队地图需要三个人至少各有一份已完成评价。<br><button class="btn primary" style="margin-top:16px" data-nav="tasks">继续评价</button></div>`;const strongest=m.dims.slice().sort((a,b)=>b.max-a.max).slice(0,3);return`<div class="eyebrow">Team complementarity</div><h1 class="page-title">团队互补地图</h1><p class="page-sub">不是比较谁更强，而是看每项关键能力由谁自然覆盖、哪里重叠、哪里需要补位。</p><section class="section card team-chart">${teamSvg(m)}</section><section class="section card"><div class="section-head"><div><h2>能力矩阵</h2><p>每一行的高分只表示该场景更自然。</p></div></div><table class="matrix"><thead><tr><th>禀赋</th>${data().founders.map(f=>`<th>${escapeHtml(f.name)}</th>`).join('')}<th>团队覆盖</th></tr></thead><tbody>${m.dims.map(d=>`<tr><td>${d.name}</td>${d.values.map(v=>`<td class="${v===d.max?'top':''}">${Math.round(v)}</td>`).join('')}<td>${Math.round(d.max)}</td></tr>`).join('')}</tbody></table></section><section class="section grid insight-grid"><article class="card insight-card"><span class="num">01 · COVERAGE</span><h3>团队覆盖优势</h3><p>${m.coverage.length?`团队在${m.coverage.slice(0,4).map(d=>d.name).join('、')}方面形成较完整覆盖。`:'当前尚未形成 75 分以上的明确能力覆盖，建议用任务继续验证。'}</p></article><article class="card insight-card"><span class="num">02 · OVERLAP</span><h3>高度重叠区域</h3><p>${m.overlap.length?`三个人在${m.overlap.map(d=>d.name).join('、')}上都倾向深度参与，需要明确最终决策者，避免共同参与变成无人负责。`:'暂未发现明显的三人高重叠区，协作边界可以围绕各自高分维度展开。'}</p></article><article class="card insight-card"><span class="num">03 · GAP</span><h3>能力缺口</h3><p>${m.gaps.length?`${m.gaps.map(d=>d.name).join('、')}缺少明显自然负责人，可能成为课程标准化与增长阶段的瓶颈；可用流程、招聘或外部伙伴补位。`:'八项能力都有至少一位成员形成自然覆盖，重点转向责任边界与协同效率。'}</p></article><article class="card insight-card"><span class="num">04 · MULTIPLICATION</span><h3>Founder Multiplication</h3><p>${strongest.map(d=>{const idx=d.values.indexOf(d.max);return`${founderName(m.profiles[idx].id)}主导${d.name}`}).join('，')}。把发现机会、交付产品与建立系统串成一条责任链，能力才会相乘。</p></article></section><div class="principle"><div><strong>一个人发现机会，一个人把机会做成产品，另一个人把产品变成可持续运行的系统。</strong></div><span>具体分工应以本页真实得分和证据为准。</span></div>`}
    function teamSvg(m){const colors=['#5e6ad2','#8b5cf6','#168f6a'],w=900,h=340,left=120,top=25,row=38,barH=7;let s=`<svg class="team-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="三位创始人八项禀赋分组条形图"><style>.t{font:12px -apple-system,BlinkMacSystemFont,sans-serif;fill:currentColor}.muted{opacity:.58}</style>`;m.dims.forEach((d,i)=>{const y=top+i*row;s+=`<text x="0" y="${y+15}" class="t">${d.name}</text>`;d.values.forEach((v,j)=>{const yy=y+j*9;s+=`<rect x="${left}" y="${yy}" width="${(w-left-50)*v/100}" height="${barH}" rx="3.5" fill="${colors[j]}"/><text x="${left+(w-left-50)*v/100+6}" y="${yy+7}" class="t muted">${Math.round(v)}</text>`})});data().founders.forEach((f,j)=>{s+=`<circle cx="${left+j*150}" cy="332" r="4" fill="${colors[j]}"/><text x="${left+9+j*150}" y="336" class="t">${escapeHtml(f.name)}</text>`});return s+'</svg>'}
    function calibrationPage(){const cal=data().calibration;return`<div class="eyebrow">Calibration session</div><h1 class="page-title">团队校准会议</h1><p class="page-sub">把量表结论带回真实事件，确认当前共识，并为未来 30 天设置验证任务。</p><div class="principle"><div><strong>Discuss evidence, not personality.</strong><br><span>讨论事件，不评价人格。</span></div><span>如果意见不同，先问：我们各自看到了什么？</span></div><section class="section card"><div class="section-head"><div><h2>会议流程</h2><p>建议预留 90 分钟，由一人负责记录。</p></div></div>${['查看每个人前三项禀赋','讨论自评与他评最大差异','回看被重复提到的真实事件','确认认可的前三项禀赋','选择一项需要继续验证的能力','分配 30 天实验任务','记录团队共识','导出会议报告'].map((x,i)=>`<div class="cal-step"><span>${i+1}</span><div>${x}</div></div>`).join('')}</section><section class="section card"><div class="section-head"><div><h2>逐人确认</h2><p>以下建议来自当前得分，可在会议中调整。</p></div></div>${data().founders.map(f=>calFounderEditor(f,cal.founders[f.id]||{})).join('')}</section><section class="section card"><div class="grid form-grid"><div class="field"><label for="cal-date">会议日期</label><input id="cal-date" type="text" data-cal="date" value="${escapeHtml(cal.date||'')}" placeholder="例如：2026-07-20"></div><div class="field"><label for="consensus">团队共识</label><textarea id="consensus" data-cal="consensus" placeholder="责任边界、协作原则、待验证假设……">${escapeHtml(cal.consensus||'')}</textarea></div></div><div class="actions" style="margin-top:18px"><button class="btn primary" data-action="save-cal">保存会议记录</button><button class="btn" data-nav="report">查看会议报告</button></div></section>`}
    function calFounderEditor(f,c){const p=calculateFounderProfile(f.id),top=topDimensions(p,3),gaps=DIMENSIONS.map(d=>({...d,gap:p.scores[d.id].gap})).filter(d=>d.gap!==null).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap)),events=data().evaluations.filter(e=>e.targetId===f.id&&e.status==='completed').flatMap(e=>e.events.filter(validEvent));const biggest=gaps[0];return`<div class="cal-founder" data-cal-founder="${f.id}"><h3>${escapeHtml(f.name)}</h3><p>当前前三：${top.map(d=>`${d.name} ${Math.round(d.final)}`).join(' · ')}</p><div class="grid insight-grid" style="margin-top:12px"><div class="manual-item"><strong>自评与他评最大差异</strong><p>${biggest?`${biggest.name}：${biggest.gap>0?'+':''}${Math.round(biggest.gap)} · ${calculateSelfTeamGap(p.scores[biggest.id])}`:'等待完整评价'}</p></div><div class="manual-item"><strong>真实事件回看</strong><p>${events.length?escapeHtml(events[0].context+' '+events[0].result):'尚无有效事件证据'}</p></div></div><div class="grid form-grid" style="margin-top:16px"><div class="field"><label>会议确认的前三禀赋</label><div class="chips">${DIMENSIONS.map(d=>`<label class="chip"><input type="checkbox" data-cal-top value="${d.id}" ${(c.confirmedTop||[]).includes(d.id)?'checked':''}><span>${d.name}</span></label>`).join('')}</div><small>最多选择 3 项</small></div><div class="field"><label>需要继续验证的能力</label><select data-cal-verify><option value="">请选择</option>${DIMENSIONS.map(d=>`<option value="${d.id}" ${c.verify===d.id?'selected':''}>${d.name}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>30 天实验任务</label><textarea data-cal-experiment>${escapeHtml(c.experiment||nextExperiment(p))}</textarea></div></div></div>`}
    function reportPage(){const complete=data().evaluations.filter(e=>e.status==='completed').length;return`<div class="eyebrow">Founder DNA report</div><div class="section-head"><div><h1 class="page-title">最终报告</h1><p class="page-sub">${escapeHtml(data().project.type)} · ${complete}/9 份评价完成</p></div><div class="actions no-print"><button class="btn" data-action="export-md">导出 Markdown</button><button class="btn primary" data-action="print">打印 / PDF</button></div></div><section class="report-block card"><div class="eyebrow">Core principle</div><h2>Discuss evidence, not personality.</h2><p>本报告不用于排名。它描述每个人在哪些场景更容易创造价值，以及如何通过责任设计让三个人形成能力乘法。</p></section>${data().founders.map((f,i)=>{const p=calculateFounderProfile(f.id);return`<section class="report-block card ${i?'page-break':''}"><div class="eyebrow">Founder ${f.id}</div><h2>${escapeHtml(f.name)}</h2><p class="snapshot">${generateFounderSummary(p)}</p><div class="grid strength-grid" style="margin-top:24px">${topDimensions(p,3).map(d=>`<div class="manual-item"><strong>${d.name}</strong><p>${Math.round(d.final)} · ${level(d.final)}</p></div>`).join('')}</div><h3 style="margin-top:24px">30 天验证任务</h3><p>${(data().calibration.founders[f.id]||{}).experiment||nextExperiment(p)}</p></section>`}).join('')}<section class="report-block card page-break"><div class="eyebrow">Team synthesis</div><h2>团队组合结论</h2><p>${teamNarrative()}</p><h3 style="margin-top:24px">校准会议共识</h3><p>${escapeHtml(data().calibration.consensus||'尚未记录。建议完成校准会议后更新最终报告。')}</p></section>`}
    function teamNarrative(){const m=calculateTeamMap();if(m.profiles.some(p=>!p.completed))return'评价尚未完整，团队结论会随着更多真实证据自动更新。';const pieces=m.profiles.map(p=>{const t=topDimensions(p,1)[0];return`${founderName(p.id)}以${t.name}为当前最自然的价值创造方式`});const gap=m.gaps[0]?`当前最需要补位的是${m.gaps[0].name}`:'八项能力已形成基础覆盖';return`${pieces.join('；')}。${gap}。这个团队真正的价值，不是三个人分别完成很多工作，而是把发现机会、建造产品和形成可持续系统连接起来。`}
    function settingsPage(){const p=data().project;return`<div class="eyebrow">Project & data</div><h1 class="page-title">设置与数据</h1><p class="page-sub">修改会保存到当前${root.activeMode==='demo'?' Demo':'正式'}数据空间。Demo 与正式数据互不覆盖。</p><section class="section card"><div class="section-head"><div><h2>外观</h2><p>默认跟随 macOS 或浏览器的浅色 / 深色设置。</p></div></div><div class="field" style="max-width:360px"><label for="theme-setting">显示模式</label><select id="theme-setting" data-theme-setting><option value="system" ${data().settings.theme==='system'?'selected':''}>跟随系统</option><option value="light" ${data().settings.theme==='light'?'selected':''}>始终浅色</option><option value="dark" ${data().settings.theme==='dark'?'selected':''}>始终深色</option></select></div></section><section class="section card"><div class="section-head"><div><h2>团队成员</h2><p>任务顺序与历史评价会保留。</p></div></div><div class="grid founders">${data().founders.map(f=>`<div class="field"><label for="name-${f.id}">${f.id} 成员</label><input id="name-${f.id}" type="text" data-founder-name="${f.id}" value="${escapeHtml(f.name)}"></div>`).join('')}</div></section><section class="section card"><div class="section-head"><div><h2>项目信息</h2><p>用于生成更贴近当前阶段的建议。</p></div></div><div class="grid form-grid">${[['type','项目类型'],['product','主要产品'],['acquisition','主要获客方式'],['software','软件阶段'],['value','核心用户价值'],['stage','当前阶段'],['direction','当前方向']].map(([k,l])=>`<div class="field"><label for="project-${k}">${l}</label><textarea id="project-${k}" data-project="${k}">${escapeHtml(p[k]||'')}</textarea></div>`).join('')}</div></section><section class="section card"><div class="section-head"><div><h2>数据导入导出</h2><p>JSON 用于备份和恢复；Markdown 用于分享最终报告。</p></div></div><div class="actions"><button class="btn" data-action="export-json">导出 JSON</button><button class="btn" data-action="import-json">导入 JSON</button><button class="btn" data-action="export-md">导出 Markdown 报告</button><button class="btn" data-action="print">打印为 PDF</button></div></section><section class="section card"><div class="section-head"><div><h2>数据空间</h2><p>正式数据和 Demo 数据完全隔离。</p></div></div><div class="actions"><button class="btn" data-action="switch-mode">${root.activeMode==='demo'?'返回正式评估':'查看 Demo 报告'}</button><button class="btn" data-action="restore-demo">恢复 Demo 数据</button><button class="btn danger" data-action="clear-data">清空全部正式数据</button></div></section>`}

    // Report Generator / import-export
    function generateMarkdown(){let md=`# Founder DNA\n\n> Know how you naturally create value.\n\n**项目：** ${data().project.type}\n\n**原则：** Discuss evidence, not personality. 讨论事件，不评价人格。\n\n`;data().founders.forEach(f=>{const p=calculateFounderProfile(f.id);md+=`## ${f.name}\n\n${generateFounderSummary(p)}\n\n### Signature Strengths\n\n`;topDimensions(p,3).forEach(d=>{md+=`- **${d.name}：${Math.round(d.final)}** — ${level(d.final)}\n`});md+=`\n### Role Fit\n\n`;calculateRoleFit(p).forEach(r=>{md+=`- ${r.name}：${Math.round(r.score)}（${roleLevel(r.score)}）\n`});md+=`\n### 30 天验证任务\n\n${(data().calibration.founders[f.id]||{}).experiment||nextExperiment(p)}\n\n`});md+=`## 团队组合结论\n\n${teamNarrative()}\n\n## 校准会议共识\n\n${data().calibration.consensus||'尚未记录。'}\n`;return md}
    function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
    function validateImport(x){return x&&x.formal&&Array.isArray(x.formal.founders)&&Array.isArray(x.formal.evaluations)&&x.formal.founders.length===3&&x.formal.evaluations.length===9}

    // Event Handlers
    function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ui.page=b.dataset.nav;ui.evaluationId=null;ui.mobileNav=false;render()});document.querySelectorAll('[data-eval]').forEach(b=>b.onclick=()=>{ui.evaluationId=b.dataset.eval;ui.evalStep=0;render()});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{ui.profileId=b.dataset.profile;render()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ui.evalStep=Number(b.dataset.step);render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleAction(b.dataset.action,b));bindEvaluation();bindSettings();bindCalibration()}
    function handleAction(a){if(a==='menu'){ui.mobileNav=!ui.mobileNav;render()}else if(a==='theme')toggleTheme();else if(a==='close-eval'){ui.evaluationId=null;render()}else if(a==='prev-step'){ui.evalStep=Math.max(0,ui.evalStep-1);render()}else if(a==='next-step'){ui.evalStep=Math.min(9,ui.evalStep+1);render()}else if(a==='add-event'){const e=currentEval();e.events.push(blankEvent());persist();render()}else if(a==='submit-eval')submitEvaluation();else if(a==='export-json')download(`founder-dna-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(root,null,2),'application/json');else if(a==='import-json')document.getElementById('file-import').click();else if(a==='export-md')download(`founder-dna-report-${new Date().toISOString().slice(0,10)}.md`,generateMarkdown(),'text/markdown;charset=utf-8');else if(a==='print')window.print();else if(a==='switch-mode'){root.activeMode=root.activeMode==='demo'?'formal':'demo';ui.page='dashboard';persist();render();toast(root.activeMode==='demo'?'已进入 Demo，正式数据未改变':'已返回正式评估')}else if(a==='restore-demo'){if(confirm('恢复 Demo 数据？只会重置 Demo，不影响正式数据。')){root.demo=makeDemo();persist();render();toast('Demo 数据已恢复')}}else if(a==='clear-data'){if(confirm('确定清空全部正式评估数据吗？此操作会重新创建空白正式数据。建议先导出 JSON 备份。')){root.formal=createFormal();root.activeMode='formal';persist();render();toast('正式数据已清空')}}else if(a==='save-cal'){persist();toast('会议记录已保存')}}
    function currentEval(){return data().evaluations.find(x=>x.id===ui.evaluationId)}
    function markDraft(e){if(e.status!=='completed')e.status='in_progress';e.updatedAt=new Date().toISOString();persist()}
    function bindEvaluation(){const e=currentEval();if(!e)return;document.querySelectorAll('[data-answer]').forEach(x=>x.onchange=()=>{e.answers[x.dataset.answer]=Number(x.value);markDraft(e)});document.querySelectorAll('[data-top]').forEach(x=>x.onchange=()=>{const idx=Number(x.dataset.top),val=x.value;if(val&&e.top3.some((v,i)=>v===val&&i!==idx)){toast('第一、第二、第三禀赋不能重复');x.value=e.top3[idx];return}e.top3[idx]=val;markDraft(e)});document.querySelectorAll('[data-field]').forEach(x=>x.onchange=()=>{e[x.dataset.field]=x.value;markDraft(e)});document.querySelectorAll('[data-scene]').forEach(x=>x.onchange=()=>{if(x.checked&&e.scenes.length>=3){x.checked=false;toast('高能场景最多选择 3 项');return}e.scenes=x.checked?[...e.scenes,x.value]:e.scenes.filter(v=>v!==x.value);markDraft(e)});document.querySelectorAll('[data-event-id]').forEach(card=>{const ev=e.events.find(x=>x.id===card.dataset.eventId);card.querySelectorAll('[data-event-field]').forEach(x=>x.oninput=debounce(()=>{ev[x.dataset.eventField]=x.value;markDraft(e)},350));card.querySelectorAll('[data-event-dim]').forEach(x=>x.onchange=()=>{ev.dimensions=x.checked?[...ev.dimensions,x.value]:ev.dimensions.filter(v=>v!==x.value);markDraft(e)})});document.querySelectorAll('[data-remove-event]').forEach(x=>x.onclick=()=>{e.events=e.events.filter(ev=>ev.id!==x.dataset.removeEvent);markDraft(e);render()})}
    function submitEvaluation(){const e=currentEval(),errors=[];const missing=QUESTIONS.filter(q=>!e.answers[q.id]);if(missing.length)errors.push(`还有 ${missing.length} 道行为题未回答`);if(e.top3.some(x=>!x)||new Set(e.top3).size!==3)errors.push('请选择三个不重复的突出禀赋');if(!e.nonNatural)errors.push('请选择一项非自然优势');if(e.nonNatural&&e.top3.includes(e.nonNatural))errors.push('非自然优势不能与前三禀赋相同');if(!e.stress)errors.push('请选择压力下的默认反应');if(e.events.filter(validEvent).length<2)errors.push('至少需要 2 个同时包含背景、行动和结果的有效事件');if(errors.length){const box=document.getElementById('eval-errors');box.innerHTML=`<div class="error-box" role="alert">${errors.map(x=>`<div>• ${x}</div>`).join('')}</div>`;box.scrollIntoView({behavior:'smooth',block:'center'});toast('请补全评价后再提交');return}if(e.status==='completed'&&!confirm('这份评价已经提交。确定要用当前内容重新提交吗？'))return;e.status='completed';e.submittedAt=new Date().toISOString();persist();ui.evaluationId=null;render();toast('评价已提交，画像与团队地图已更新')}
    function bindSettings(){document.querySelectorAll('[data-founder-name]').forEach(x=>x.onchange=()=>{const f=data().founders.find(f=>f.id===x.dataset.founderName);if(!x.value.trim()){x.value=f.name;toast('名字不能为空');return}f.name=x.value.trim();persist();render()});document.querySelectorAll('[data-project]').forEach(x=>x.onchange=()=>{data().project[x.dataset.project]=x.value.trim();persist()});document.querySelectorAll('[data-theme-setting]').forEach(x=>x.onchange=()=>{data().settings.theme=x.value;persist();applyTheme();toast(x.value==='system'?'已设置为跟随系统':x.value==='light'?'已设置为始终浅色':'已设置为始终深色')})}
    function bindCalibration(){const cal=data().calibration;document.querySelectorAll('[data-cal]').forEach(x=>x.oninput=debounce(()=>{cal[x.dataset.cal]=x.value;persist()},300));document.querySelectorAll('[data-cal-founder]').forEach(card=>{const id=card.dataset.calFounder;if(!cal.founders[id])cal.founders[id]={confirmedTop:[],verify:'',experiment:''};const c=cal.founders[id];card.querySelectorAll('[data-cal-top]').forEach(x=>x.onchange=()=>{if(x.checked&&c.confirmedTop.length>=3){x.checked=false;toast('每个人最多确认 3 项禀赋');return}c.confirmedTop=x.checked?[...c.confirmedTop,x.value]:c.confirmedTop.filter(v=>v!==x.value);persist()});const v=card.querySelector('[data-cal-verify]');if(v)v.onchange=()=>{c.verify=v.value;persist()};const ex=card.querySelector('[data-cal-experiment]');if(ex)ex.oninput=debounce(()=>{c.experiment=ex.value;persist()},300)})}
    function debounce(fn,ms){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms)}}
    function applyTheme(){const pref=(data()?.settings?.theme)||'system';const dark=pref==='dark'||(pref==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light'}
    function toggleTheme(){const s=data().settings||(data().settings={theme:'system'});const next=s.theme==='system'?'dark':s.theme==='dark'?'light':'system';s.theme=next;persist();applyTheme();toast(next==='system'?'显示模式：跟随系统':next==='dark'?'显示模式：始终深色':'显示模式：始终浅色')}
    document.getElementById('file-import').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!validateImport(x))throw new Error('结构不符合 Founder DNA 数据格式');if(confirm('导入会替换当前浏览器中的 Founder DNA 数据，确定继续吗？')){root=x;persist();ui={page:'dashboard',evaluationId:null,evalStep:0,profileId:'A',mobileNav:false};render();toast('数据导入成功')}}catch(err){toast(`导入失败：${err.message}`)}e.target.value=''};reader.readAsText(file)});

    // App Initialization
    function showWelcome(){document.body.insertAdjacentHTML('beforeend',`<div id="welcome" class="modal open" role="dialog" aria-modal="true" aria-labelledby="welcome-title"><div class="modal-panel"><div class="eyebrow">Founder DNA</div><h2 id="welcome-title">看清团队如何自然创造价值</h2><p>正式评估从空白开始；Demo 会立即展示完整画像、角色匹配和团队地图。两套数据互不覆盖，所有数据仅保存在当前浏览器。</p><div class="mode-choice"><button data-welcome="formal"><strong>开始正式评估</strong><span>使用朱振方、创始人 B、创始人 C 三位默认成员，可在设置中修改</span></button><button data-welcome="demo"><strong>查看 Demo 报告</strong><span>用完整示例数据体验所有页面与算法</span></button></div></div></div>`);document.querySelectorAll('[data-welcome]').forEach(b=>b.onclick=()=>{root.activeMode=b.dataset.welcome;persist();document.getElementById('welcome').remove();render()})}
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if((data()?.settings?.theme||'system')==='system')applyTheme()});render();if(!root.activeMode)showWelcome();
  })();
  </script>
</body>
