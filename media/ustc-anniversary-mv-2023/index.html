                <h1 class="essay-title">校庆 MV《漫游瀚海》</h1>
            </header>
            <div class="essay-body">
                <p>2023 年 9 月 22 日，中国科学技术大学官方微信公众号发布 65 周年校庆 MV《漫游瀚海》。</p>
                <p>我参与了拍摄，不过参演片段未保留在最终成片中，只在文末“参与演出”名单里留下了名字。</p>
                <p><a href="https://mp.weixin.qq.com/s/FkIojObQz-R6LSwjNJiM5Q">阅读原文：《星光永恒！中国科大发布2023年校庆MV《漫游瀚海》》 →</a></p>
