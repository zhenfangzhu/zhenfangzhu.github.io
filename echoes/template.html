    <script>try{const l=localStorage.getItem('site-language');if(l==='en'||l==='zh'){document.documentElement.dataset.language=l;document.documentElement.lang=l==='zh'?'zh-CN':'en'}}catch(e){}</script>

<body data-title-zh="Echoes｜回声" data-title-en="Echoes | Zhenfang Zhu">
    <header class="site-chrome"><a class="site-return" href="/"><span data-lang="zh">← 返回个人主页</span><span data-lang="en">← Back to homepage</span></a></header>
    <a class="skip-link" href="#echoes-content"><span data-lang="zh">跳到正文</span><span data-lang="en">Skip to content</span></a>
    <main class="echoes-page" id="echoes-content">

        <header class="echoes-heading"><h1>Echoes<span data-lang="zh">｜回声</span></h1></header>

        <div class="echoes-tools" hidden>
            <label class="echo-visually-hidden" for="echo-search"><span data-lang="zh">搜索笔记</span><span data-lang="en">Search notes</span></label>
            <div class="echo-search-line">
            <svg class="echo-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
            <input id="echo-search" type="search" autocomplete="off" placeholder="搜索回声" data-placeholder-en="Search echoes">
            </div>
            <div class="echoes-actions"><p id="echo-count" role="status"></p><button type="button" id="echo-toggle-all"><span data-lang="zh">展开全部</span><span data-lang="en">Expand all</span></button></div>
        </div>
        <section class="echoes-stream echoes-accordion" aria-label="Echoes">
{{ENTRIES}}
        </section>
        <p class="echoes-empty" id="echo-empty" hidden><span data-lang="zh">没有找到相关笔记，试试其他关键词。</span><span data-lang="en">No matching notes. Try another keyword.</span></p>
        <p class="echoes-byline"><span data-lang="zh">我听见了一些东西。<br>它们离开以后，留下了这些。</span><span data-lang="en">I heard a few things.<br>After they were gone, this is what stayed.</span></p>
    </main>
